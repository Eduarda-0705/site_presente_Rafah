<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta property="og:title" content="Um presente para você 💙"><meta property="og:description" content="Toque para abrir a sua surpresa."><title>Um presente para você 💙</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF3FA; --spark:#E0A93B; --ink:#1F3A5F; --soft:#5E7A99;
  --box:#B9D6EE; --box-dark:#9CC1E2; --lid:#CBE2F4; --ribbon:#FFFFFF; --btn:#1F3A5F; --btn-ink:#FFFFFF;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F1B2B; --spark:#F3D98B; --ink:#E6F0FA; --soft:#8FA8C2;
    --box:#3F6A94; --box-dark:#325878; --lid:#4D7AA6; --ribbon:#E6F0FA; --btn:#E6F0FA; --btn-ink:#0F1B2B;
  }
}
:root[data-theme="dark"]{
  --bg:#0F1B2B; --spark:#F3D98B; --ink:#E6F0FA; --soft:#8FA8C2;
  --box:#3F6A94; --box-dark:#325878; --lid:#4D7AA6; --ribbon:#E6F0FA; --btn:#E6F0FA; --btn-ink:#0F1B2B;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;
  display:flex;align-items:center;justify-content:center;overflow-x:hidden}
main{width:100%;max-width:560px;padding:24px;text-align:center;position:relative;min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}

/* gift */
#gift{transition:opacity .9s ease, transform .9s ease;display:flex;flex-direction:column;align-items:center;gap:40px}
.box{position:relative;width:170px;height:170px;cursor:pointer;background:none;border:0;padding:0}
.box:focus-visible{outline:2px solid var(--ink);outline-offset:12px;border-radius:8px}
.body,.lid{position:absolute;left:0;right:0}
.body{bottom:0;height:120px;background:var(--box);border-radius:4px 4px 8px 8px}
.body::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--ribbon);opacity:.9}
.lid{top:14px;height:42px;left:-8px;right:-8px;background:var(--lid);border-radius:6px;
  transform-origin:left bottom;transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
.lid::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:22px;margin-left:-11px;background:var(--ribbon);opacity:.9}
.lid::before{content:"";position:absolute;left:50%;top:-18px;width:34px;height:20px;margin-left:-17px;
  border:3px solid var(--ribbon);border-radius:50% 50% 0 0;border-bottom:0;opacity:.9}
.box:not(.open){animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{50%{transform:translateY(-6px)}}
.box.open .lid{transform:translate(-26px,-70px) rotate(-24deg)}
.box.open .body{background:var(--box-dark)}
.hint{margin:0;font-size:15px;letter-spacing:.04em;color:var(--soft)}
.hint b{font-weight:400;color:var(--ink)}

.sp{position:fixed;z-index:20;pointer-events:none;color:var(--spark);line-height:1;text-shadow:0 0 8px var(--spark);opacity:0;
  animation:spk 1.7s ease-out var(--dl) forwards}
@keyframes spk{0%{opacity:0;transform:translate(0,0) scale(.2) rotate(0)}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1) rotate(90deg)}}
/* reveal */
#reveal{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;
  padding:24px;overflow-y:auto;opacity:0;pointer-events:none;transition:opacity 1.2s ease .5s}
body.opened #gift{opacity:0;transform:scale(.94);pointer-events:none}
body.opened #reveal{opacity:1;pointer-events:auto}
h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:400;font-size:clamp(30px,8vw,44px);line-height:1.15;margin:0 0 14px}
.msg{font-family:'Cormorant Garamond',Georgia,serif;font-size:clamp(20px,5vw,24px);line-height:1.5;margin:0 0 24px;max-width:26em}
.player{display:block;max-width:100%;max-height:50vh;border-radius:12px;background:var(--box)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<main>
  <section id="gift">
    <button class="box" id="box" aria-label="Abrir meu presente">
      <span class="lid"></span><span class="body"></span>
    </button>
    <p class="hint">Aqui tem uma surpresa para vocês<br><b>Toque para abrir</b></p>
  </section>

  <section id="reveal" aria-live="polite">
    <h1>Rafahzinho, tão amado, esperado e desejado! 💙</h1>
    <p class="msg">Queremos dizer a você BEM-VINDO, nos alegramos com a sua chegada!</p>
    <video class="player" src="video.mp4" controls playsinline preload="metadata" title="Música para o Rafael"></video>
  </section>
</main>
<script>
  var box=document.getElementById('box');
  function sparkle(){
    var r=box.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+20;
    for(var i=0;i<22;i++){var e=document.createElement('span');e.className='sp';e.textContent=i%3?'\u2726':'\u00b7';
      var a=-Math.PI/2+(Math.random()-.5)*2.6,d=60+Math.random()*130;
      e.style.cssText='left:'+x+'px;top:'+y+'px;font-size:'+(8+Math.random()*12)+'px;--dx:'+Math.cos(a)*d+'px;--dy:'+(Math.sin(a)*d-20)+'px;--dl:'+(Math.random()*.7)+'s';
      document.body.appendChild(e);(function(el){setTimeout(function(){el.remove()},2600)})(e)}
  }
  box.addEventListener('click',function(){
    if(box.classList.contains('open'))return;
    box.classList.add('open');sparkle();
    setTimeout(function(){document.body.classList.add('opened')},1100);
  });
</script>
</body>
</html>
